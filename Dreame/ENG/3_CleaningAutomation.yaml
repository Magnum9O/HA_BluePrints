blueprint:
  name: Dreame Vacuum - Advanced Cleaning Automation
  description: |
    Smart automatic cleaning system for Dreame vacuums.

    Features:
    - Main slot: standard morning + adaptive evening
    - 4 extra schedules: each with morning and evening logic
    - Robot state and presence checks
    - Adaptive evening logic to avoid redundant cleanings

    How it works:
    - Each slot can be enabled or disabled independently
    - Morning slots always run with their configured mode
    - Evening slots can always run, skip, or adapt if the home was already cleaned
  domain: automation
  source_url: https://raw.githubusercontent.com/Magnum9O/HA_BluePrints/main/Dreame/ENG/3_CleaningAutomation.yaml
  input:
    vacuum_entity:
      name: Robot vacuum
      description: Select your main Dreame vacuum entity.
      selector:
        entity:
          domain: vacuum

    robot_status_sensor:
      name: Robot status sensor
      description: Sensor that reports the robot status such as idle, cleaning, returning, charging, or docked.
      selector:
        entity:
          domain: sensor

    presence_entity:
      name: Presence entity
      description: Entity that tells whether someone is home.
      selector:
        entity: {}

    presence_value:
      name: Empty home value
      description: The value that means the house is empty, for example `0`, `away`, `off`, or `not_home`.
      default: "0"
      selector:
        text: {}

    flag_cleaned_today:
      name: Cleaning completed flag
      description: Input boolean used to track whether the house has already been cleaned today.
      selector:
        entity:
          domain: input_boolean

    main_weekdays:
      name: MAIN SLOT - Active weekdays
      description: Days when the main slot is active.
      default: []
      selector:
        select:
          multiple: true
          mode: list
          options:
            - monday
            - tuesday
            - wednesday
            - thursday
            - friday
            - saturday
            - sunday

    main_morning_on:
      name: MAIN SLOT - Morning - Enable
      default: false
      selector:
        boolean: {}

    main_morning_time:
      name: MAIN SLOT - Morning - Time
      default: "05:00:00"
      selector:
        time: {}

    main_morning_preset:
      name: MAIN SLOT - Morning - Mode
      default: "aspira"
      selector:
        select:
          options:
            - value: "aspira"
              label: "Vacuum only"
            - value: "lava"
              label: "Mop only"
            - value: "aspira_lava"
              label: "Vacuum + mop (Clean Genius)"
            - value: "cleangenius_deep"
              label: "Vacuum + mop (Clean Genius Deep)"

    main_morning_rooms:
      name: MAIN SLOT - Morning - Rooms
      description: Room IDs separated by commas, for example `1,2,3`. Leave empty for the whole house.
      default: ""
      selector:
        text: {}

    main_evening_on:
      name: MAIN SLOT - Evening - Enable
      default: false
      selector:
        boolean: {}

    main_evening_time:
      name: MAIN SLOT - Evening - Time
      default: "23:00:00"
      selector:
        time: {}

    main_evening_conditional:
      name: MAIN SLOT - Evening - Adaptive behavior
      description: Choose whether the evening slot should always run, skip, or adapt if the flag says cleaning already happened today.
      default: "always_clean"
      selector:
        select:
          options:
            - value: "always_clean"
              label: "Always clean"
            - value: "skip_if_cleaned"
              label: "Skip if already cleaned"
            - value: "adapt_if_cleaned"
              label: "Adapt if already cleaned"

    main_evening_preset:
      name: MAIN SLOT - Evening - Main mode
      default: "aspira"
      selector:
        select:
          options:
            - value: "aspira"
              label: "Vacuum only"
            - value: "lava"
              label: "Mop only"
            - value: "aspira_lava"
              label: "Vacuum + mop (Clean Genius)"
            - value: "cleangenius_deep"
              label: "Vacuum + mop (Clean Genius Deep)"

    main_evening_rooms:
      name: MAIN SLOT - Evening - Main rooms
      description: Room IDs separated by commas, for example `1,2,3`. Leave empty for the whole house.
      default: ""
      selector:
        text: {}

    main_evening_fallback_preset:
      name: MAIN SLOT - Evening - Fallback mode
      default: "lava"
      selector:
        select:
          options:
            - value: "aspira"
              label: "Vacuum only"
            - value: "lava"
              label: "Mop only"
            - value: "aspira_lava"
              label: "Vacuum + mop (Clean Genius)"
            - value: "cleangenius_deep"
              label: "Vacuum + mop (Clean Genius Deep)"

    main_evening_fallback_rooms:
      name: MAIN SLOT - Evening - Fallback rooms
      description: Room IDs separated by commas. Leave empty to reuse the main rooms.
      default: ""
      selector:
        text: {}

    schedule1_morning_on:
      name: SCHEDULE 1 - Morning - Enable
      default: false
      selector:
        boolean: {}

    schedule1_weekdays:
