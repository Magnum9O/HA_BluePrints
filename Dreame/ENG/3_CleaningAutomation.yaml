variables:
  robot_status: !input robot_status_sensor
  vacuum_ent: !input vacuum_entity
  presence_ent: !input presence_entity
  pres_val: !input presence_value
  flag_ent: !input flag_cleaned_today
  debug_enabled: !input debug_mode

trigger:
  - platform: time
    at: !input main_morning_time
    id: main_morning
  - platform: time
    at: !input main_evening_time
    id: main_evening
  - platform: time
    at: !input schedule1_morning_time
    id: schedule1_morning
  - platform: time
    at: !input schedule1_evening_time
    id: schedule1_evening
  - platform: time
    at: !input schedule2_morning_time
    id: schedule2_morning
  - platform: time
    at: !input schedule2_evening_time
    id: schedule2_evening
  - platform: time
    at: !input schedule3_morning_time
    id: schedule3_morning
  - platform: time
    at: !input schedule3_evening_time
    id: schedule3_evening
  - platform: time
    at: !input schedule4_morning_time
    id: schedule4_morning
  - platform: time
    at: !input schedule4_evening_time
    id: schedule4_evening

condition:
  - condition: and
    conditions:
      - condition: template
        value_template: >
          {{ states(robot_status) in ['idle', 'sleeping', 'charging', 'docked'] }}
      - condition: template
        value_template: >
          {{ states(presence_ent) == pres_val }}
      - condition: template
        value_template: >
          {%- set today = now().strftime('%A') | lower -%}
          {%- if trigger.id == 'main_morning' -%}
            {{ main_morning_on and today in main_weekdays }}
          {%- elif trigger.id == 'main_evening' -%}
            {{ main_evening_on and today in main_weekdays }}
          {%- elif trigger.id == 'schedule1_morning' -%}
            {{ schedule1_morning_on and today in schedule1_weekdays }}
          {%- elif trigger.id == 'schedule1_evening' -%}
            {{ schedule1_evening_on and today in schedule1_weekdays }}
          {%- elif trigger.id == 'schedule2_morning' -%}
            {{ schedule2_morning_on and today in schedule2_weekdays }}
          {%- elif trigger.id == 'schedule2_evening' -%}
            {{ schedule2_evening_on and today in schedule2_weekdays }}
          {%- elif trigger.id == 'schedule3_morning' -%}
            {{ schedule3_morning_on and today in schedule3_weekdays }}
          {%- elif trigger.id == 'schedule3_evening' -%}
            {{ schedule3_evening_on and today in schedule3_weekdays }}
          {%- elif trigger.id == 'schedule4_morning' -%}
            {{ schedule4_morning_on and today in schedule4_weekdays }}
          {%- elif trigger.id == 'schedule4_evening' -%}
            {{ schedule4_evening_on and today in schedule4_weekdays }}
          {%- else -%}
            false
          {%- endif -%}

action:
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'main_morning' }}"
        sequence:
          - variables:
              current_preset: "{{ main_morning_preset }}"
              current_rooms: "{{ main_morning_rooms }}"
          - sequence: &run_morning
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                then:
                  - service: persistent_notification.create
                    data:
                      title: "Dreame - Morning slot"
                      message: "Mode: {{ current_preset }} | Rooms: {{ current_rooms if current_rooms else 'Whole house' }}"
              - service: dreame_vacuum.vacuum_clean_segment
                target:
                  entity_id: "{{ vacuum_ent }}"
                data:
                  segments: >
                    {% if current_rooms %}
                      {{ current_rooms.split(',') | map('int') | list }}
                    {% else %}
                      []
                    {% endif %}
                  cleaning_mode: "{{ current_preset }}"
              - service: input_boolean.turn_on
                target:
                  entity_id: "{{ flag_ent }}"

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'main_evening' }}"
        sequence:
          - variables:
              current_conditional: "{{ main_evening_conditional }}"
              current_preset: "{{ main_evening_preset }}"
              current_rooms: "{{ main_evening_rooms }}"
              fallback_preset: "{{ main_evening_fallback_preset }}"
              fallback_rooms: "{{ main_evening_fallback_rooms }}"
          - sequence: &run_evening
              - variables:
                  already_cleaned: "{{ states(flag_ent) == 'on' }}"
                  conditional_mode: "{{ current_conditional }}"
              - if:
                  - condition: template
                    value_template: "{{ debug_enabled }}"
                then:
                  - service: persistent_notification.create
                    data:
                      title: "Dreame - Evening slot"
                      message: "Already cleaned: {{ already_cleaned }} | Logic: {{ conditional_mode }}"
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ conditional_mode == 'skip_if_cleaned' and already_cleaned }}"
                    sequence:
                      - if:
                          - condition: template
                            value_template: "{{ debug_enabled }}"
                        then:
                          - service: persistent_notification.create
                            data:
                              title: "Dreame - Cleaning skipped"
                              message: "Evening cleaning skipped because the house is already marked as cleaned today."
                  - conditions:
                      - condition: template
                        value_template: "{{ conditional_mode == 'adapt_if_cleaned' and already_cleaned }}"
                    sequence:
                      - service: dreame_vacuum.vacuum_clean_segment
                        target:
                          entity_id: "{{ vacuum_ent }}"
                        data:
                          segments: >
                            {% if fallback_rooms %}
                              {{ fallback_rooms.split(',') | map('int') | list }}
                            {% else %}
                              []
                            {% endif %}
                          cleaning_mode: "{{ fallback_preset }}"
                default:
                  - service: dreame_vacuum.vacuum_clean_segment
                    target:
                      entity_id: "{{ vacuum_ent }}"
                    data:
                      segments: >
                        {% if current_rooms %}
                          {{ current_rooms.split(',') | map('int') | list }}
                        {% else %}
                          []
                        {% endif %}
                      cleaning_mode: "{{ current_preset }}"
                  - service: input_boolean.turn_on
                    target:
                      entity_id: "{{ flag_ent }}"

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule1_morning' }}"
        sequence:
          - variables:
              current_preset: "{{ schedule1_morning_preset }}"
              current_rooms: "{{ schedule1_morning_rooms }}"
          - sequence: *run_morning

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule1_evening' }}"
        sequence:
          - variables:
              current_conditional: "{{ schedule1_evening_conditional }}"
              current_preset: "{{ schedule1_evening_preset }}"
              current_rooms: "{{ schedule1_evening_rooms }}"
              fallback_preset: "{{ schedule1_evening_fallback_preset }}"
              fallback_rooms: "{{ schedule1_evening_fallback_rooms }}"
          - sequence: *run_evening

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule2_morning' }}"
        sequence:
          - variables:
              current_preset: "{{ schedule2_morning_preset }}"
              current_rooms: "{{ schedule2_morning_rooms }}"
          - sequence: *run_morning

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule2_evening' }}"
        sequence:
          - variables:
              current_conditional: "{{ schedule2_evening_conditional }}"
              current_preset: "{{ schedule2_evening_preset }}"
              current_rooms: "{{ schedule2_evening_rooms }}"
              fallback_preset: "{{ schedule2_evening_fallback_preset }}"
              fallback_rooms: "{{ schedule2_evening_fallback_rooms }}"
          - sequence: *run_evening

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule3_morning' }}"
        sequence:
          - variables:
              current_preset: "{{ schedule3_morning_preset }}"
              current_rooms: "{{ schedule3_morning_rooms }}"
          - sequence: *run_morning

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule3_evening' }}"
        sequence:
          - variables:
              current_conditional: "{{ schedule3_evening_conditional }}"
              current_preset: "{{ schedule3_evening_preset }}"
              current_rooms: "{{ schedule3_evening_rooms }}"
              fallback_preset: "{{ schedule3_evening_fallback_preset }}"
              fallback_rooms: "{{ schedule3_evening_fallback_rooms }}"
          - sequence: *run_evening

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule4_morning' }}"
        sequence:
          - variables:
              current_preset: "{{ schedule4_morning_preset }}"
              current_rooms: "{{ schedule4_morning_rooms }}"
          - sequence: *run_morning

      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'schedule4_evening' }}"
        sequence:
          - variables:
              current_conditional: "{{ schedule4_evening_conditional }}"
              current_preset: "{{ schedule4_evening_preset }}"
              current_rooms: "{{ schedule4_evening_rooms }}"
              fallback_preset: "{{ schedule4_evening_fallback_preset }}"
              fallback_rooms: "{{ schedule4_evening_fallback_rooms }}"
          - sequence: *run_evening

    default:
      - if:
          - condition: template
            value_template: "{{ debug_enabled }}"
        then:
          - service: persistent_notification.create
            data:
              title: "Dreame - Error"
              message: "Unknown trigger id: {{ trigger.id }}"

mode: queued
max: 10
